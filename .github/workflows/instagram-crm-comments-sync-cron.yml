# Sync diário — comentários Instagram para o CRM de audiência
#
# Secrets no repositório (Settings → Secrets → Actions):
#   APP_URL        — URL pública do portal
#   CRON_SECRET    — mesmo valor configurado no runtime do app

name: Instagram CRM comments sync (daily)

on:
  schedule:
    # 03:03 UTC — depois do sync de mídia (02:58)
    - cron: "3 3 * * *"
  workflow_dispatch:

concurrency:
  group: instagram-crm-comments-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Trigger /api/cron/instagram-crm-comments-sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - name: Call cron endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL e CRON_SECRET devem estar configurados nos secrets do repositório."
            exit 1
          fi
          curl -fsS --retry 2 --retry-delay 10 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/instagram-crm-comments-sync"
