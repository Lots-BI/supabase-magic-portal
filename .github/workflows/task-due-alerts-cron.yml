# Avisa o proprietário quando a entrega da tarefa é hoje (8h em São Paulo).
#
# Secrets no repositório (Settings → Secrets → Actions):
#   APP_URL        — URL pública do portal
#   CRON_SECRET    — mesmo valor configurado no runtime do app

name: Task due alerts (daily)

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

concurrency:
  group: task-due-alerts
  cancel-in-progress: false

jobs:
  notify:
    name: Trigger /api/cron/task-due-alerts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - name: Call cron endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL e CRON_SECRET devem estar configurados nos secrets do repositório."
            exit 1
          fi
          curl -fsS --retry 2 --retry-delay 10 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/task-due-alerts"
