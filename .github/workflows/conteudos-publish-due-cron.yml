# Publica conteúdos aprovados no horário do calendário editorial.
#
# Secrets no repositório (Settings → Secrets → Actions):
#   APP_URL        — URL pública do portal
#   CRON_SECRET    — mesmo valor configurado no runtime do app

name: Conteúdos publish due (every 5 minutes)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: conteudos-publish-due
  cancel-in-progress: false

jobs:
  publish:
    name: Trigger /api/cron/conteudos-publish-due
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - name: Call cron endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL e CRON_SECRET devem estar configurados nos secrets do repositório."
            exit 1
          fi
          curl -fsS --retry 2 --retry-delay 10 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/conteudos-publish-due"
